<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>재미있는 한글 배우기</title>

<style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        background-color: #fffdf5;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 42px;
        margin-bottom: 10px;
    }

    h2 {
        font-size: 26px;
        margin-bottom: 25px;
    }

    button {
        font-size: 24px;
        font-weight: bold;

        width: 190px;
        height: 70px;

        margin: 8px;

        border: 2px solid #ddd;
        border-radius: 20px;

        background-color: white;

        cursor: pointer;
    }

    button:hover {
        transform: scale(1.05);
    }

    #bigWord {
        font-size: 90px;
        font-weight: bold;

        margin-bottom: 10px;

    }

    #carPicture {
        margin-top: 10px;

    }

    #carPicture img {
        width: 350px;
        max-width: 80%;
        height: auto;

        border-radius: 25px;
    }

    /* 폭죽 효과 */
#confetti {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
}

.confetti-piece {
    position: absolute;
    top: -30px;
    font-size: 35px;
    animation: fall 2.5s linear forwards;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>


<body>

    <h1>🚗 재미있는 한글 배우기 🚜</h1>

    <h2>자동차와 함께 한글을 배워요!</h2>


    <button onclick="speakCar('소방차','firetruck.jpg')">🚒 소방차</button>

    <button onclick="speakCar('버스','bus.jpg')">🚌 버스</button>

    <button onclick="speakCar('굴착기','excavator.jpg')">🚜 굴착기</button>

    <button onclick="speakCar('덤프트럭','dumptruck.jpg')">🚚 덤프트럭</button>

    <button onclick="speakCar('경찰차','policecar.jpg')">🚓 경찰차</button>

    <button onclick="speakCar('구급차','ambulance.jpg')">🚑 구급차</button>

    <button onclick="speakCar('청소차','garbagetruck.jpg')">🚛 청소차</button>

    <button onclick="speakCar('수송차','transporttruck.jpg')">🚚 수송차</button>

    <button onclick="speakCar('레미콘','cementmixer.jpg')">🚛 레미콘</button>

    <button onclick="speakCar('기중기','crane.jpg')">🏗️ 기중기</button>

    <button onclick="speakCar('트랙터','tractor.jpg')">🚜 트랙터</button>

    <button onclick="speakCar('승용차','car.jpg')">🚗 승용차</button>

    <div id="bigWord"></div>

    <hr style="margin-top:50px;">

<h1>🚗 자동차 이름 맞히기</h1>

<p style="font-size:24px;">
    사진을 보고 자동차 이름을 골라보세요!
</p>

<button onclick="startQuiz()">게임 시작</button>

<div id="quizPicture" style="margin-top:25px;"></div>

<div id="quizButtons" style="margin-top:20px;"></div>

<div id="quizResult"
     style="font-size:40px; font-weight:bold; margin-top:20px;">
</div>

<div id="confetti"></div>

<hr style="margin:50px 0;">

<h1>🅿️ 주차장 게임</h1>

<p style="font-size:28px;">
    자! 주차해 보자! 🚗
</p>

<button onclick="startParkingGame()">주차장 게임 시작</button>

<div id="parkingGame" style="margin-top:30px;">

    <div id="parkingLots"
         style="display:flex; justify-content:center; gap:15px;">
    </div>

    <div id="parkingCar"
         style="margin-top:35px; text-align:center;">
    </div>

    <div id="parkingResult"
         style="font-size:36px; font-weight:bold; margin-top:20px;">
    </div>

</div>
<script>

    function speakCar(word, picture) {

    const display = document.getElementById("bigWord");
    const carPicture = document.getElementById("carPicture");

    display.innerHTML = "";

    carPicture.innerHTML =
        '<img src="' + picture + '" alt="' + word + '" style="width:350px; max-width:80%; height:auto;">';

    carPicture.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    const cars = [
        "소방차", "버스", "굴착기", "덤프트럭", "경찰차",
        "구급차", "청소차", "수송차", "레미콘", "기중기",
        "불도저", "트랙터", "택시", "승용차", "트럭",
        "견인차", "우편차", "유치원 버스", "캠핑카", "오토바이"
    ];

    const wordNumber = cars.indexOf(word) + 1;

    let i = 0;

    function nextLetter() {

        if (i < word.length) {

            const letter = word[i];

            if (letter === " ") {
                display.innerHTML += " ";
                i++;
                nextLetter();
                return;
            }

            display.innerHTML += letter + " ";

            const letterAudio =
                new Audio("audio/letter_" + letter.charCodeAt(0) + ".mp3");

            letterAudio.onended = function () {
                i++;
                setTimeout(nextLetter, 200);
            };

            letterAudio.play();

        } else {

            setTimeout(function () {
                const wordAudio =
                    new Audio("audio/word_" + wordNumber + ".mp3");

                wordAudio.play();
            }, 500);
        }
    }

    nextLetter();
}

const cars = [
    {name:"소방차", image:"firetruck.jpg"},
    {name:"버스", image:"bus.jpg"},
    {name:"굴착기", image:"excavator.jpg"},
    {name:"덤프트럭", image:"dumptruck.jpg"},
    {name:"경찰차", image:"policecar.jpg"},
    {name:"구급차", image:"ambulance.jpg"},
    {name:"청소차", image:"garbagetruck.jpg"},
    {name:"수송차", image:"transporttruck.jpg"},
    {name:"레미콘", image:"cementmixer.jpg"},
    {name:"기중기", image:"crane.jpg"},
    {name:"불도저", image:"bulldozer.jpg"},
    {name:"트랙터", image:"tractor.jpg"},
    {name:"택시", image:"taxi.jpg"},
    {name:"승용차", image:"car.jpg"},
    {name:"트럭", image:"truck.jpg"},
    {name:"견인차", image:"towtruck.jpg"},
    {name:"우편차", image:"mailtruck.jpg"},
    {name:"유치원 버스", image:"schoolbus.jpg"},
    {name:"캠핑카", image:"campervan.jpg"},
    {name:"오토바이", image:"motorcycle.jpg"}
];





let quizStartTime;

function startQuiz() {

    const answer =
        cars[Math.floor(Math.random() * cars.length)];

    let choices = [answer];

    while (choices.length < 3) {

        const randomCar =
            cars[Math.floor(Math.random() * cars.length)];

        if (!choices.includes(randomCar)) {
            choices.push(randomCar);
        }
    }

    choices.sort(() => Math.random() - 0.5);

    document.getElementById("quizPicture").innerHTML =
        '<img src="' + answer.image +
        '" style="width:350px; max-width:80%; border-radius:25px;">';
document.getElementById("quizPicture").scrollIntoView({
    behavior: "smooth",
    block: "center"
});
setTimeout(() => {
    window.scrollBy({ top: 300, behavior: "smooth" });
}, 500);
    const buttons =
        document.getElementById("quizButtons");

    buttons.innerHTML = "";

    document.getElementById("quizResult").innerHTML = "";

    // 문제가 나온 시간 기록
    quizStartTime = Date.now();

    choices.forEach(function(car) {

        const button =
            document.createElement("button");

        button.innerText = car.name;

        button.onclick = function() {

            const time =
                (Date.now() - quizStartTime) / 1000;

            if (car.name === answer.name) {

                // 3초 안에 맞힌 경우
                
                if (time <= 10) {

    document.getElementById("quizResult").innerHTML =
        "🎉 🥳 ✨<br>딩동댕!";

    showConfetti();

                } else {

                    document.getElementById("quizResult").innerHTML =
                        "딩동댕!";
                }

                speakMessage("딩동댕");

            } else {

                document.getElementById("quizResult").innerHTML =
                    "😊 다시 도전해보자!";

                speakMessage("다시 도전해보자");
            }
        };

        buttons.appendChild(button);
    });
}

function speakMessage(message) {

    let file;

    if (message === "딩동댕") {
        file = "audio/quiz-correct.mp3";
    } else if (message === "다시 도전해보자") {
        file = "audio/quiz-wrong.mp3";
    } else {
        return;
    }

    const audio = new Audio(file);
    audio.play();
}

   
function showConfetti() {

     fireworkSound();
    const confetti =
        document.getElementById("confetti");

    const icons =
        ["🎉", "✨", "⭐", "🎊", "💥"];

    for (let i = 0; i < 35; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti-piece";

        piece.innerText =
            icons[Math.floor(Math.random() * icons.length)];

        piece.style.left =
            Math.random() * 100 + "%";

        piece.style.animationDelay =
            Math.random() * 0.5 + "s";

        piece.style.fontSize =
            (25 + Math.random() * 30) + "px";

        confetti.appendChild(piece);
    }


    setTimeout(function() {
        confetti.innerHTML = "";
    }, 3000);
}

function showConfetti() {
  fireworkSound();
    const confetti =
        document.getElementById("confetti");

    const icons =
        ["🎉", "✨", "⭐", "🎊", "💥"];

    for (let i = 0; i < 35; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti-piece";

        piece.innerText =
            icons[Math.floor(Math.random() * icons.length)];

        piece.style.left =
            Math.random() * 100 + "%";

        piece.style.animationDelay =
            Math.random() * 0.5 + "s";

        piece.style.fontSize =
            (25 + Math.random() * 30) + "px";

        confetti.appendChild(piece);
    }

    setTimeout(function() {
        confetti.innerHTML = "";
    }, 3000);
}
function fireworkSound() {

    const audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

    function pianoNote(frequency, startTime) {

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;

        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(
            0.01,
            startTime + 0.5
        );

        oscillator.start(startTime);
        oscillator.stop(startTime + 0.5);
    }

    const now = audioContext.currentTime;

    // 딩 - 동 - 댕
    pianoNote(523.25, now);
    pianoNote(659.25, now + 0.25);
    pianoNote(783.99, now + 0.5);
}
// ================================
// 주차장 게임
// ================================

function startParkingGame() {

    const answer =
        cars[Math.floor(Math.random() * cars.length)];

    let choices = [answer];

    while (choices.length < 3) {
        const randomCar =
            cars[Math.floor(Math.random() * cars.length)];

        if (!choices.includes(randomCar)) {
            choices.push(randomCar);
        }
    }

    choices.sort(() => Math.random() - 0.5);

    const parkingLots =
        document.getElementById("parkingLots");

    const parkingCar =
        document.getElementById("parkingCar");

    const parkingResult =
        document.getElementById("parkingResult");

    parkingLots.innerHTML = "";
    parkingCar.innerHTML = "";
    parkingResult.innerHTML = "";
setTimeout(function() {
    document.getElementById("parkingLots").scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

    setTimeout(function() {
        window.scrollBy({
            top: 180,
            behavior: "smooth"
        });
    }, 400);

}, 100);
    // 주차칸 3개 만들기
// 주차칸 3개 만들기
parkingLots.style.gap = "0";
parkingLots.style.alignItems = "flex-end";

choices.forEach(function(car) {

    const lot = document.createElement("div");

    lot.innerText = car.name;
    lot.dataset.name = car.name;
if (car.name === answer.name) {
    lot.style.color = "#ff3b30";
} else {
    lot.style.color = "#222";
}

   lot.style.width = "220px";
lot.style.height = "190px";

// 주차장 선
lot.style.borderLeft = "6px solid white";
lot.style.borderRight = "0";
lot.style.borderTop = "0";
lot.style.borderBottom = "6px solid white";

lot.style.background = "#777";
lot.style.boxSizing = "border-box";

lot.style.color =
    car.name === answer.name ? "#ff3333" : "white";

lot.style.fontSize = "30px";
lot.style.fontWeight = "bold";

lot.style.position = "relative";
   lot.innerHTML =
    '<div style="font-size:46px; color:white;">P</div>' +
    '<div style="font-size:30px; font-weight:bold; white-space:nowrap;">' +
        car.name +
    '</div>' +
    '<div style="' +
        'position:absolute;' +
        'bottom:22px;' +
        'left:50%;' +
        'transform:translateX(-50%);' +
        'width:120px;' +
        'height:18px;' +
        'border-radius:6px;' +
        'background:repeating-linear-gradient(' +
            '135deg,' +
            '#ffd600 0px,' +
            '#ffd600 16px,' +
            '#222 16px,' +
            '#222 32px' +
        ');' +
        'box-shadow:0 4px 3px rgba(0,0,0,0.35);' +
    '"></div>';

lot.style.borderLeft = "6px solid white";
lot.style.borderBottom = "6px solid white";
lot.style.borderTop = "0";
lot.style.borderRight = "0";

    lot.style.display = "flex";
    lot.style.alignItems = "flex-start";
    lot.style.justifyContent = "center";
    lot.style.paddingTop = "15px";
    lot.style.boxSizing = "border-box";

    parkingLots.appendChild(lot);
});

// 마지막 주차칸 오른쪽 선
if (parkingLots.lastElementChild) {
    parkingLots.lastElementChild.style.borderRight = "6px solid white";
}

    // 주차할 자동차
    const img = document.createElement("img");

    img.src = answer.image;
    img.alt = answer.name;
    img.dataset.name = answer.name;
    img.draggable = false;

    img.style.width = "250px";
    img.style.maxWidth = "70%";
    img.style.borderRadius = "20px";
    img.style.cursor = "grab";
    img.style.touchAction = "none";

    parkingCar.appendChild(img);



// 자동차 드래그 시작
// 자동차 드래그 시작
img.addEventListener("pointerdown", function(e) {

    e.preventDefault();

    const startX = e.clientX;
    const startY = e.clientY;

    img.setPointerCapture(e.pointerId);
    img.style.position = "relative";
    img.style.zIndex = "1000";

    function moveCar(e) {
        img.style.transform =
            "translate(" +
            (e.clientX - startX) + "px, " +
            (e.clientY - startY) + "px)";
    }
function stopCar(e) {

    document.removeEventListener("pointermove", moveCar);
    document.removeEventListener("pointerup", stopCar);

    const carRect = img.getBoundingClientRect();
    const carCenterX = carRect.left + carRect.width / 2;
    const carCenterY = carRect.top + carRect.height / 2;

    let selectedLot = null;

    Array.from(parkingLots.children).forEach(function(lot) {

        const lotRect = lot.getBoundingClientRect();

        if (
            carCenterX >= lotRect.left &&
            carCenterX <= lotRect.right &&
            carCenterY >= lotRect.top &&
            carCenterY <= lotRect.bottom
        ) {
            selectedLot = lot;
        }
    });

    if (
        selectedLot &&
        selectedLot.dataset.name === answer.name
    ) {

        parkingResult.innerHTML = "🎉 최고!";

        img.style.transform = "none";
        img.style.position = "static";
        img.style.width = "150px";
        img.style.maxWidth = "90%";
        img.style.cursor = "default";
        img.style.touchAction = "auto";

        selectedLot.appendChild(img);

        showConfetti();
        speakMessage("딩동댕");

    } else {

        parkingResult.innerHTML = "😊 다시 해보자!";

        img.style.transition = "transform 0.4s";
        img.style.transform = "translate(0px, 0px)";

        setTimeout(function() {
            img.style.transition = "";
        }, 400);
    }
}

    document.addEventListener("pointermove", moveCar);
    document.addEventListener("pointerup", stopCar);
});
}
</script>
